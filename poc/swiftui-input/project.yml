# PROTOTYPE — SwiftUI 기준점. XcodeGen으로 .xcodeproj를 만들어요: `xcodegen` 실행 후 열기.
name: OatSwiftUIPoC
options:
  bundleIdPrefix: dev.oat.poc
  deploymentTarget:
    iOS: "17.0"
targets:
  OatSwiftUIPoC:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.oat.poc.swiftuiinput
        PRODUCT_NAME: "oat PoC (SwiftUI)"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
