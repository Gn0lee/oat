<!doctype html>
<html><head><meta charset="utf-8">
<style>
body{margin:0;padding:16px;font-family:var(--font-sans,system-ui);background:var(--background,#fff);color:var(--foreground,#171717)}
.cap{font-size:14px;font-weight:700;margin:0 0 8px}
.ph{--bg:#F4F5F3;--sf:#fff;--tx:#191F28;--tx2:#6B7684;--up:#F04452;--dn:#3182F6;--line:#E5E8EB;max-width:330px;
 background:var(--bg);color:var(--tx);border-radius:28px;border:6px solid #222;padding:14px 12px 10px;font-family:-apple-system,system-ui}
.top{font-weight:700;font-size:17px;margin:4px 4px 2px}
.as{font-size:12px;color:var(--tx2);margin:0 4px 10px}
.card{background:var(--sf);border-radius:16px;padding:10px 14px;margin-bottom:10px}
.big{font-size:26px;font-weight:700}
.r{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:14px}
.r+.r{border-top:1px solid var(--line)}
.s{font-size:12px;color:var(--tx2)}
.up{color:var(--up);font-weight:600}.dn{color:var(--dn);font-weight:600}
.stale{color:var(--tx2)}
.pill{font-size:10px;border:1px solid var(--line);border-radius:5px;padding:1px 4px;margin-left:4px;color:var(--tx2)}
.foot{font-size:11px;color:var(--tx2);padding:4px 6px 2px;line-height:1.5}
</style></head><body>
<p class="cap">투자 화면</p>
<div class="ph">
<div class="top">투자</div>
<div class="as">11/21 15:30 기준 · 1종목 평가에서 빠짐</div>
<div class="card"><div class="s">평가액</div><div class="big">61,250,300원</div>
<div class="s">평가손익 <span class="up">+1,904,000 (+3.2%)</span></div></div>
<div class="card">
<div class="r"><div>삼성전자<div class="s">120주 · 15:30</div></div><div style="text-align:right">8,940,000<div class="up" style="font-size:12px">+4.1%</div></div></div>
<div class="r"><div>AAPL<div class="s">40주 · 미국 11/20 종가</div></div><div style="text-align:right">14,102,000<div class="dn" style="font-size:12px">−1.2%</div></div></div>
<div class="r"><div>KODEX 200<div class="s">80주 · <span>11/20 종가</span><span class="pill">지연</span></div></div><div style="text-align:right" class="stale">3,104,000<div style="font-size:12px">+0.8%</div></div></div>
<div class="r"><div>XYZ Corp<div class="s">30주 · 상장폐지</div></div><div style="text-align:right" class="s">시세 없음<div>평가에서 빠짐</div></div></div>
</div>
<div class="foot">USD 1,385.20원(11/21 매매기준율)<br>시세: 한국투자증권 · 공공데이터포털(금융위원회) · 환율: 한국은행</div>
</div>
</body></html>
