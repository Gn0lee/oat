<!doctype html>
<html><head><meta charset="utf-8">
<style>
body{margin:0;padding:16px;font-family:var(--font-sans,system-ui);background:var(--background,#fff);color:var(--foreground,#171717)}
.wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.cap{font-size:14px;font-weight:700;margin:0 0 8px}
.ph{--bg:#F4F5F3;--sf:#fff;--tx:#191F28;--tx2:#6B7684;--up:#F04452;--dn:#3182F6;--line:#E5E8EB;
 background:var(--bg);color:var(--tx);border-radius:28px;border:6px solid #222;padding:14px 12px 10px;font-family:-apple-system,system-ui}
.top{font-weight:700;font-size:17px;margin:4px 4px 10px}
.card{background:var(--sf);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.h{font-size:15px;font-weight:700;margin-bottom:6px}
.r{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:14px}
.r+.r{border-top:1px solid var(--line)}
.s{font-size:12px;color:var(--tx2)}
.b{font-weight:700;font-size:16px}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.up{color:var(--up);font-weight:600}
.leg span{font-size:11px;color:var(--tx2);margin-right:8px;white-space:nowrap}
svg text{font-size:9px;fill:#6B7684}
</style></head><body>
<div class="wrap">
<div><p class="cap">자산 탭 위쪽: 묶음별 잔액 (A1)</p>
<div class="ph">
<div class="top">자산</div>
<div class="card">
<div class="r"><span><i class="sw" style="background:#7C8A99"></i>쓸 수 있는 돈</span><span class="b">4,812,000</span></div>
<div class="r"><span><i class="sw" style="background:#B59F7B"></i>모으는 돈</span><span class="b">23,400,000</span></div>
<div class="r"><span><i class="sw" style="background:#5E7F7A"></i>투자</span><span class="b">61,250,300</span></div>
<div class="r" style="border:0;padding-top:0"><span class="s">11/21 15:30 기준 · <span class="up">+3.2%</span></span><span class="s">›</span></div>
<div class="r"><span><i class="sw" style="background:#A58CA8"></i>포인트·상품권</span><span class="b">86,200</span></div>
<div class="r"><span><i class="sw" style="background:#C9CDD2"></i>갚아야 할 돈</span><span class="b">−1,420,000</span></div>
</div>
<div class="card"><div class="r"><span class="s">순자산 합계는 아래 추이에서만</span></div></div>
</div></div>

<div><p class="cap">자산 탭 아래: 월별 자산 추이 (A2) + 나간 가구원</p>
<div class="ph">
<div class="card"><div class="h">월별 자산 추이</div>
<svg width="100%" viewBox="0 0 260 170">
<line x1="20" x2="258" y1="130" y2="130" stroke="#B0B8C1"/>
<g id="bars"></g>
<polyline id="net" fill="none" stroke="#191F28" stroke-width="2"/>
<line x1="137" x2="137" y1="8" y2="150" stroke="#6B7684" stroke-dasharray="3 3"/>
<text x="104" y="10">민호 나감</text>
</svg>
<div class="leg"><span><i class="sw" style="background:#7C8A99"></i>쓸 수 있는</span><span><i class="sw" style="background:#B59F7B"></i>모으는</span><span><i class="sw" style="background:#5E7F7A"></i>투자</span><span><i class="sw" style="background:#A58CA8"></i>포인트</span><span><i class="sw" style="background:#C9CDD2"></i>갚아야 할 돈(아래)</span><span>— 순자산</span></div>
<div class="r" style="margin-top:6px"><span>9월 <span class="s">민호의 지갑 3개 보관 · −2,840만</span></span><span class="s">›</span></div>
<div class="r"><span class="s">5월 미국 1종목 시세 없음 ○</span><span class="s">›</span></div>
</div>
</div></div>
</div>
<script>
const months=['6','7','8','9','10','11'];
const data=[[4,20,48,.1,-1.5],[4.5,21,50,.1,-1.2],[4.2,22,53,.1,-1.6],[3.1,15,38,.1,-1.0],[4.4,23,58,.1,-1.3],[4.8,23.4,61,.1,-1.4]];
const s=1.05, base=130, cols=['#7C8A99','#B59F7B','#5E7F7A','#A58CA8'];
let g='',pts=[];
data.forEach((d,i)=>{const x=28+i*38;let y=base;
 d.slice(0,4).forEach((v,k)=>{const h=v*s;y-=h;g+=`<rect x="${x}" y="${y}" width="22" height="${h}" fill="${cols[k]}"/>`});
 g+=`<rect x="${x}" y="${base}" width="22" height="${-d[4]*s*4}" fill="#C9CDD2"/>`;
 const net=d.reduce((a,b)=>a+b,0);pts.push(`${x+11},${base-net*s}`);
 g+=`<text x="${x+6}" y="166">${months[i]}월</text>`;
 if(i===4) g+=`<circle cx="${x+11}" cy="${base-net*s-12}" r="0"/>`;
});
document.getElementById('bars').innerHTML=g;document.getElementById('net').setAttribute('points',pts.join(' '));
</script>
</body></html>
