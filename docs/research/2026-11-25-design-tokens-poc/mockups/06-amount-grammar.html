<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
body{margin:0;padding:16px;font-family:var(--font-sans,system-ui);background:var(--background,#fff);color:var(--foreground,#171717);font-size:14px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.cap{font-size:13px;font-weight:700;margin:0 0 6px}
.ph{background:#F4F5F3;border-radius:16px;padding:10px;font-family:'Pretendard',sans-serif;color:#191F28}
.c{background:#fff;border-radius:12px;padding:6px 12px;margin-bottom:8px}
.h{font-size:12px;color:#5B6470;padding-top:6px}
.r{display:flex;justify-content:space-between;padding:7px 0;font-size:15px}
.r b{font-weight:600;font-variant-numeric:tabular-nums}
</style></head><body>
<div class="grid" id="g"></div>
<script>
const O={
 'A 두 문법 (토스식, 추천)':{inc:'#1B64DA',exp:'#191F28',diff:'#191F28',up:'#C81E2D',down:'#1B64DA'},
 'B 가계부는 색 없음':{inc:'#191F28',exp:'#191F28',diff:'#191F28',up:'#C81E2D',down:'#1B64DA'},
 'C 지금 결정대로':{inc:'#191F28',exp:'#191F28',diff:'#1B64DA',up:'#C81E2D',down:'#1B64DA'}};
document.getElementById('g').innerHTML=Object.entries(O).map(([n,p])=>`<div><p class="cap">${n}</p><div class="ph">
<div class="c"><div class="h">가계부 · 11월 24일</div>
<div class="r"><span>월급</span><b style="color:${p.inc}">+3,800,000원</b></div>
<div class="r"><span>올리브영</span><b style="color:${p.exp}">−52,720원</b></div>
<div class="r"><span>커피</span><b style="color:${p.exp}">−4,500원</b></div>
<div class="h">이번 달 쓴 돈 · 평소 이맘때 대비</div>
<div class="r"><span>식비</span><b style="color:${p.diff}">12만 원 덜</b></div></div>
<div class="c"><div class="h">투자</div>
<div class="r"><span>삼성전자</span><b style="color:${p.up}">+4.2%</b></div>
<div class="r"><span>애플</span><b style="color:${p.down}">−1.3%</b></div></div>
</div></div>`).join('');
</script>
</body></html>
