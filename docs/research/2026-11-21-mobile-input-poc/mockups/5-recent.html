<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:12px;font-family:var(--font-sans,system-ui);background:var(--background,#fff);color:var(--foreground,#171717)}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;width:210px}
.ph{position:relative;width:200px;height:340px;border-radius:20px;background:#fff;border:1px solid #ccc;overflow:hidden;color:#191F28;font-size:11px}
.top{padding:10px 12px 0;color:#888;font-size:10px}.q{padding:2px 12px 6px;font-weight:700;font-size:14px}
.sr{margin:0 12px 8px;background:#F4F5F3;border-radius:8px;padding:6px;color:#999}
.it{display:flex;justify-content:space-between;padding:7px 12px;border-bottom:1px solid #f0f0f0}.it i{font-style:normal;color:#888;font-size:10px}
.sk{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#14573F;font-weight:700}
.chip{display:inline-block;border:1px solid #ddd;border-radius:12px;padding:4px 8px;margin:3px}.on{border-color:#14573F;color:#14573F;font-weight:700}
.lbl{font-weight:700;font-size:12px}.sub{font-size:11px;color:var(--muted-foreground,#666);text-align:center}
</style></head><body><div class="row">
<div class="col"><div class="ph"><div class="top">🏠 공용 지출 · 12,000원</div><div class="q">어디서 썼어요?</div><div class="sr">🔍 가맹점 검색·입력</div>
<div class="it">스타벅스 <i>카페 · 현대카드</i></div><div class="it">이마트 <i>장보기 · 신한체크</i></div><div class="it">쿠팡 <i>생활 · 현대카드</i></div><div class="it">GS25 <i>간식 · 신한체크</i></div><div class="it">배달의민족 <i>배달 · 네이버페이</i></div>
<div class="sk">건너뛰기</div></div><div class="lbl">③-1 가맹점</div><div class="sub">최근 가맹점을 누르면 카테고리·결제수단까지 채우고 확인으로</div></div>
<div class="col"><div class="ph"><div class="top">🏠 공용 지출 · 12,000원</div><div class="q">어떤 결제수단?</div>
<div style="padding:0 8px"><span class="chip on">현대카드 (최근)</span><span class="chip">신한체크</span><span class="chip">네이버페이</span><span class="chip">현금</span><span class="chip">생활비 통장</span></div></div>
<div class="lbl">③-3 결제수단</div><div class="sub">모를 때는 묻되, 최근에 쓴 것을 맨 앞에</div></div>
</div></body></html>
