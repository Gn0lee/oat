<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:12px;font-family:var(--font-sans,system-ui);background:var(--background,#fff);color:var(--foreground,#171717);font-size:13px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;justify-content:center}
.st{border:1px solid var(--border,#ddd);border-radius:10px;padding:8px 10px;width:140px;background:var(--card,#fff)}
.st h4{margin:0 0 4px;font-size:13px}.st p{margin:0;font-size:11px;color:var(--muted-foreground,#666)}
.opt{border-style:dashed}.ar{align-self:center;font-size:18px;color:var(--muted-foreground,#888)}
.tag{display:inline-block;font-size:10px;padding:1px 5px;border-radius:4px;background:var(--muted,#eee);margin-top:4px}
</style></head><body>
<div class="flow">
<div class="st"><h4>입구</h4><p>투자 화면 [매매 기록] → 사기/팔기 메뉴<br>종목 상세 [더 사기]·[팔기] → ③까지 건너뜀</p></div>
<div class="ar">→</div>
<div class="st opt"><h4>② 어느 계좌?</h4><p>증권 계좌가 하나면 건너뜀. 장부는 계좌가 정함(묻지 않음)</p></div>
<div class="ar">→</div>
<div class="st"><h4>③ 어떤 종목?</h4><p>보유 종목 맨 위(팔기는 보유만). 이름·코드·초성·한글 미국명</p></div>
<div class="ar">→</div>
<div class="st"><h4>④ 몇 주?</h4><p>미국은 소수점 키. 팔기는 [전부 12주] 칩</p></div>
<div class="ar">→</div>
<div class="st"><h4>⑤ 얼마에?</h4><p>1주 단가. [11/20 종가 71,200] 칩. [총액으로 입력] 전환</p></div>
<div class="ar">→</div>
<div class="st"><h4>⑥ 확인</h4><p>체결일, 금액, 매매 비용(추정), USD면 기준환율, 메모</p><span class="tag">저장</span></div>
</div></body></html>
