<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:12px;font-family:var(--font-sans,system-ui);background:var(--background,#fff);color:var(--foreground,#171717)}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;width:190px}
.ph{position:relative;width:180px;height:340px;border-radius:22px;background:#F4F5F3;border:1px solid #ccc;overflow:hidden;color:#191F28;font-size:11px}
.hd{padding:14px 12px 4px;font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.big{padding:0 12px;font-size:20px;font-weight:700}
.card{margin:8px 10px;background:#fff;border-radius:10px;height:46px}
.tab{position:absolute;bottom:0;left:0;right:0;height:44px;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;align-items:center;font-size:10px;color:#888}
.tab b{color:#14573F}
.fab{position:absolute;right:12px;bottom:54px;width:40px;height:40px;border-radius:20px;background:#14573F;color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.ctr{width:34px;height:34px;border-radius:17px;background:#14573F;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center}
.lbl{font-weight:700;font-size:13px}.sub{font-size:12px;color:var(--muted-foreground,#666);text-align:center}
.x{text-decoration:line-through;opacity:.6}
</style></head><body><div class="row">
