<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:12px;font-family:var(--font-sans,system-ui);background:var(--background,#fff);color:var(--foreground,#171717);font-size:13px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;justify-content:center}
.st{border:1px solid var(--border,#ddd);border-radius:10px;padding:8px 10px;width:150px;background:var(--card,#fff)}
.st h4{margin:0 0 4px;font-size:13px}.st p{margin:0;font-size:11px;color:var(--muted-foreground,#666)}
.opt{border-style:dashed}.ar{align-self:center;font-size:18px;color:var(--muted-foreground,#888)}
.m{margin-top:4px;font-size:11px}.m div{border:1px solid var(--border,#ddd);border-radius:6px;padding:2px 6px;margin:2px 0}
.tag{display:inline-block;font-size:10px;padding:1px 5px;border-radius:4px;background:var(--muted,#eee);margin-top:4px}
</style></head><body>
<div class="flow">
<div class="st"><h4>① 무엇을 기록?</h4><p>+ 누르면 뜨는 메뉴</p><div class="m"><div>🏠 공용 지출</div><div>🔒 내 지출</div><div>수입</div><div>이체</div></div><span class="tag">고르면 바로 다음</span></div>
<div class="ar">→</div>
<div class="st opt"><h4>①-2 어느 장부?</h4><p>수입·이체만. 장부 하나면 건너뜀</p></div>
<div class="ar">→</div>
<div class="st"><h4>② 얼마?</h4><p>키패드만. 위에 "공용 지출" 표시(바꾸기는 뒤로)</p><span class="tag">다음</span></div>
<div class="ar">→</div>
<div class="st opt"><h4>③ 모르는 칸만</h4><p>가맹점 → 카테고리 → 결제수단. 아는 값이면 건너뜀</p><span class="tag">고르면 바로 다음</span></div>
<div class="ar">→</div>
<div class="st"><h4>④ 확인</h4><p>모두 보여줌. 칸을 누르면 그 단계만 시트로 열고 다시 확인으로</p><span class="tag">저장 · 저장하고 하나 더</span></div>
</div>
<p style="font-size:11px;color:var(--muted-foreground,#666);text-align:center">실선 = 늘 나오는 단계 · 점선 = 조건부 단계 · 뒤로 가기 하면 앞 단계 값 유지</p>
</body></html>
