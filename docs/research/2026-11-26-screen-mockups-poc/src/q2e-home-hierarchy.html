<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>/*BASE*/ /*TOKENS*/
.ph{height:667px}
.ph .hd{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.ph .card{background:var(--o-surface);border-radius:20px;padding:20px;margin:0 12px 12px}
.ph .rw{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.ph .pill{font-size:15px;font-weight:600;line-height:20px;padding:8px 14px;border-radius:999px;background:var(--o-surface-alt);color:var(--o-text)}
.ph .pillP{background:var(--o-primary-soft);color:var(--o-primary-text)}
.ph .line{padding:4px 32px 16px;display:flex;justify-content:space-between}
.ph .ttl{font-size:17px;line-height:25.5px;font-weight:600}
.ph .tabbar{position:absolute;left:0;right:0;bottom:0;height:83px;background:var(--o-surface);border-top:1px solid var(--o-divider);display:flex;justify-content:space-around;padding-top:8px;font-size:11px;color:var(--o-text-sub)}
.ph .tabbar b{color:var(--o-primary-text);font-weight:600}
.ph .fab{position:absolute;right:16px;bottom:99px;width:56px;height:56px;border-radius:28px;background:var(--o-primary);color:var(--o-on-primary);display:flex;align-items:center;justify-content:center;font-size:28px}
</style></head><body>
<p class="note">홈 = 회색 바탕 + 주제마다 카드. 큰 숫자는 맨 위 카드에만, 다른 카드는 17pt로 가볍게, 한 줄 정보는 바탕 위에 바로. 확인할 것·받을 돈이 다 있는 바쁜 날이에요.</p>
<div class="row" id="r"></div>
<script>
const H=`<div class="sb"></div><div class="hd"><span class="t2">11월</span><span class="sub">◯</span></div>
<div class="card"><div class="fn sub">이번 달 쓴 돈</div><div class="hero">1,284,500원</div>
<div class="bs">평소 이맘때보다 12만 원 덜</div><div class="fn sub">공용 98만 원 · 내 30만 원</div>
<div class="rw" style="padding-bottom:0;margin-top:8px"><span class="bs sub">수입</span><span class="amt">3,800,000원</span></div>
<div class="rw" style="padding-bottom:0"><span class="bs sub">남은 돈</span><span class="amt">2,515,500원</span></div></div>
<div class="line"><span class="bs">외식을 평소 이맘때보다 9만 원 더 썼어요</span><span class="sub">›</span></div>
<div class="card"><div class="rw" style="padding:0"><div><div class="ttl">월세 예정 확인</div><div class="fn sub">오늘 · 생활비 통장 · 외 1건</div></div><span class="pill pillP">확정</span></div></div>
<div class="card"><div class="rw" style="padding:0"><div><div class="amt">약 1,120,000원</div><div class="fn sub">곧 나갈 돈 3건</div></div><span class="sub">›</span></div>
<div class="rw"><span class="bs">관리비 · 11월 28일</span><span class="amts">−240,000원</span></div>
<div class="rw" style="padding-bottom:0"><span class="bs">가족카드 대금 · 12월 1일</span><span class="amts">−820,000원</span></div></div>
<div class="card"><div class="rw" style="padding:0"><div><div class="amt">45,000원</div><div class="fn sub">받을 돈 · 지수 12일째</div></div><span class="sub">›</span></div></div>
<div class="fab">+</div><div class="tabbar"><b>홈</b><span>기록</span><span>분석</span><span>자산</span></div>`;
document.getElementById('r').innerHTML=[['라이트',''],['다크',' dark']].map(([n,c])=>`<div><p class="cap-h">${n}</p><div class="ph${c}">${H}</div></div>`).join('');
</script></body></html>
