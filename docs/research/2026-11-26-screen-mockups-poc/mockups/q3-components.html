<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>/* 페이지 틀(시안 밖)은 Orca 테마 변수, 폰 안(.ph)은 DESIGN.md 토큰만 쓴다 */
body{margin:0;padding:16px;font-family:var(--font-sans,system-ui);background:var(--background,#fff);color:var(--foreground,#171717);font-size:14px;line-height:1.5}
.note{font-size:13px;color:var(--muted-foreground,#666);margin:4px 0 12px}
.cap-h{font-size:14px;font-weight:700;margin:0 0 6px}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-bottom:20px}
.ph{width:375px;flex:none;box-sizing:border-box;background:var(--o-background);color:var(--o-text);font-family:'Pretendard',system-ui,sans-serif;border-radius:28px;overflow:hidden;position:relative;border:1px solid var(--border,#ddd);font-size:17px;line-height:25.5px;letter-spacing:0}
.ph *{box-sizing:border-box}
.ph .sb{height:20px}
/* 타이포 토큰 */
.ph .hero{font-size:32px;line-height:42px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.ph .t1{font-size:26px;line-height:35px;font-weight:700}
.ph .t2{font-size:22px;line-height:31px;font-weight:700}
.ph .t3{font-size:20px;line-height:29px;font-weight:600}
.ph .bd{font-size:17px;line-height:25.5px;font-weight:400}
.ph .amt{font-size:17px;line-height:25.5px;font-weight:600;font-variant-numeric:tabular-nums}
.ph .bs{font-size:15px;line-height:22.5px;font-weight:400}
.ph .fn{font-size:13px;line-height:19.5px;font-weight:400}
.ph .amts{font-size:13px;line-height:19.5px;font-weight:600;font-variant-numeric:tabular-nums}
.ph .cp{font-size:11px;line-height:16.5px;font-weight:400}
.ph .sub{color:var(--o-text-sub)}
.ph .inc{color:var(--o-amount-income)}
.ph .up{color:var(--o-amount-up)}
.ph .dn{color:var(--o-amount-down)}
.ph .pine{color:var(--o-primary-text)}
.ph .sb6{font-weight:600}
.ph .fx{display:flex;justify-content:space-between;align-items:center;gap:8px}
 .ph{--o-primary:#14573f;--o-on-primary:#ffffff;--o-primary-pressed:#0e4431;--o-primary-text:#14573f;--o-primary-soft:#e6f0eb;--o-background:#f4f5f3;--o-surface:#ffffff;--o-surface-alt:#efecea;--o-text:#191f28;--o-text-sub:#5b6470;--o-text-disabled:#b0b8c1;--o-divider:#e5e8e6;--o-border-strong:#868e8a;--o-danger:#c81e2d;--o-warning:#a85400;--o-warning-soft:#fff3e0;--o-scrim:#00000033;--o-pressed:#191f280d;--o-amount-income:#1b64da;--o-amount-up:#c81e2d;--o-amount-up-display:#f04452;--o-amount-down:#1b64da;--o-amount-down-display:#3182f6;--o-ledger-private:#8e3b7e;--o-ledger-private-soft:#f7e8f3;--o-chart-group-cash:#edb345;--o-chart-group-saving:#7a59c3;--o-chart-group-invest:#008b96;--o-chart-group-point:#ecb7df;--o-chart-group-lent:#b66b31;--o-chart-group-debt:#8e9592;--o-chart-dim:#e5e8e6;--o-chart-neutral:#868e8a;--o-chart-line:#191f28;--o-chart-reference:#5b6470;--o-chart-axis:#868e8a} .ph.dark{--o-primary:#1f7a55;--o-on-primary:#ffffff;--o-primary-pressed:#186446;--o-primary-text:#5cc59a;--o-primary-soft:#1a2e25;--o-background:#121413;--o-surface:#1c1f1e;--o-surface-alt:#242826;--o-text:#e8eae9;--o-text-sub:#8e9592;--o-text-disabled:#565c59;--o-divider:#2c302e;--o-border-strong:#767d7a;--o-danger:#ff6b6b;--o-warning:#ffa861;--o-warning-soft:#3d2500;--o-scrim:#0000008f;--o-pressed:#e8eae91c;--o-amount-income:#4795ff;--o-amount-up:#ff6b6b;--o-amount-up-display:#ff6b6b;--o-amount-down:#4795ff;--o-amount-down-display:#4795ff;--o-ledger-private:#e7a3d8;--o-ledger-private-soft:#3a2335;--o-chart-group-cash:#f7c15f;--o-chart-group-saving:#886acf;--o-chart-group-invest:#3fbfcc;--o-chart-group-point:#f8d0ee;--o-chart-group-lent:#d78951;--o-chart-group-debt:#6e7572;--o-chart-dim:#2c302e;--o-chart-neutral:#767d7a;--o-chart-line:#e8eae9;--o-chart-reference:#8e9592;--o-chart-axis:#767d7a}
.ph{background:var(--o-surface);padding:8px 0 24px}
.ph .grp{padding:16px 24px 4px}
.ph .gl{font-size:11px;line-height:16px;color:#E5484D;font-weight:600;letter-spacing:.2px;margin-bottom:8px}
.ph .band{height:16px;background:var(--o-background);margin-top:16px}
.ph .rw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;gap:8px}
.ph .btn{height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;margin-bottom:8px}
.ph .b1{background:var(--o-primary);color:var(--o-on-primary)}
.ph .b2{background:var(--o-surface-alt);color:var(--o-text)}
.ph .pill{font-size:15px;font-weight:600;line-height:20px;padding:8px 14px;border-radius:999px;background:var(--o-surface-alt);color:var(--o-text);white-space:nowrap}
.ph .pillP{background:var(--o-primary-soft);color:var(--o-primary-text)}
.ph .tb{color:var(--o-primary-text);font-size:15px;font-weight:600}
.ph .dg{color:var(--o-danger);font-size:15px;font-weight:600}
.ph .chip{display:inline-flex;align-items:center;gap:4px;font-size:15px;line-height:20px;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--o-border-strong);color:var(--o-text);margin:0 6px 6px 0}
.ph .chipOn{background:var(--o-primary-soft);border-color:var(--o-primary-text);color:var(--o-primary-text)}
.ph .chipL{background:var(--o-ledger-private-soft);border-color:transparent;color:var(--o-ledger-private)}
.ph .badge{display:inline-block;font-size:13px;line-height:18px;font-weight:600;padding:1px 6px;border-radius:6px;background:var(--o-surface-alt);color:var(--o-text-sub);margin-right:6px}
.ph .sw{width:51px;height:31px;border-radius:16px;background:var(--o-primary);position:relative}
.ph .sw:after{content:'';position:absolute;right:2px;top:2px;width:27px;height:27px;border-radius:14px;background:#fff}
.ph .inp{height:48px;border-radius:12px;border:1px solid var(--o-border-strong);display:flex;align-items:center;padding:0 14px;color:var(--o-text-sub)}
.ph .seg{display:flex;justify-content:center;gap:24px;align-items:center}
.ph .fab{width:56px;height:56px;border-radius:28px;background:var(--o-primary);color:var(--o-on-primary);display:flex;align-items:center;justify-content:center;font-size:28px}
.ph .toast{background:var(--o-text);color:var(--o-surface);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;font-size:15px}
.ph .toast b{color:var(--o-surface);font-weight:600;text-decoration:underline}
.ph .card{background:var(--o-surface);border-radius:20px;padding:20px;margin:0}
.ph .onbg{background:var(--o-background);padding:12px;border-radius:12px}
</style></head><body>
<p class="note">부품 어휘 초안이에요. 빨간 작은 글자가 부품 이름이에요. 새 화면은 이 부품만 조립해요.</p>
<div class="row" id="r"></div>
<script>
const C=`
<div class="grp"><div class="gl">① 숫자 블록 · 화면당 하나</div><div class="fn sub">이번 달 쓴 돈</div><div class="hero">1,284,500원</div><div class="bs">평소 이맘때보다 12만 원 덜</div></div>
<div class="grp"><div class="gl">② 섹션 제목</div><div class="t3">결제</div></div>
<div class="grp" style="padding-top:4px"><div class="gl">③ 목록 줄 (질문 4에서 자세히)</div>
<div class="rw"><div><div class="bd">이마트</div><div class="fn sub">장보기 · 민호</div></div><span class="amt">−84,300원</span></div>
<div class="rw"><div><div class="bd">월급</div><div class="fn sub">급여 · 민호 · 급여 통장</div></div><span class="amt inc">+3,800,000원</span></div></div>
<div class="grp" style="padding-top:4px"><div class="gl">④ 칸 줄 · 누르면 시트</div>
<div class="rw"><span class="bs sub">카테고리</span><span class="bd">장보기 <span class="sub">›</span></span></div>
<div class="rw"><span class="bs sub">낸 곳</span><span class="bd">민호 · 생활비 통장 <span class="sub">›</span></span></div></div>
<div class="band"></div>
<div class="grp"><div class="gl">⑤ 띠 16 · 주제가 바뀔 때 (평면 화면)</div><div class="fn sub">위의 회색 면이에요</div></div>
<div class="grp"><div class="gl">⑥ 카드 · 홈에만 (회색 바탕 위)</div><div class="onbg"><div class="card"><div class="rw" style="padding:0"><div><div class="amt">1,120,000원</div><div class="fn sub">곧 나갈 돈 3건</div></div><span class="sub">›</span></div></div></div></div>
<div class="grp"><div class="gl">⑦ 버튼 위계</div>
<div class="btn b1">저장</div><div class="btn b2">저장하고 하나 더</div>
<div class="rw"><span class="pill pillP">확정</span><span class="pill">보기</span><span class="tb">더 보기</span><span class="dg">기록 삭제</span></div>
<div class="fn sub">주 버튼 · 보조 버튼 · 알약(줄 안 행동) · 글자 버튼 · 위험</div></div>
<div class="grp"><div class="gl">⑧ 칩 · 누를 수 있음</div>
<span class="chip">전체 장부 ▾</span><span class="chip">원 ▾</span><span class="chip chipOn">투자</span><span class="chip chipL">🔒 내 장부</span></div>
<div class="grp"><div class="gl">⑨ 배지 · 표시만 (질문 6에서 색)</div>
<span class="badge">지연</span><span class="badge">추정</span><span class="badge">보내는 중</span><span class="badge">지난번과 같음</span></div>
<div class="grp"><div class="gl">⑩ 스위치 · ⑪ 입력칸</div><div class="rw"><span class="bd">무이자</span><span class="sw"></span></div><div class="inp">가맹점 검색</div></div>
<div class="grp"><div class="gl">⑫ 달 넘기기</div><div class="seg"><span class="sub t3">‹</span><span class="t3">11월</span><span class="sub t3">›</span></div></div>
<div class="grp"><div class="gl">⑬ 토스트 · ⑭ 떠 있는 +</div><div class="rw"><div class="toast" style="flex:1"><span>저장했어요</span><b>되돌리기</b></div><div class="fab">+</div></div></div>
<div class="grp"><div class="gl">그 밖에(따로 그림 없음)</div><div class="fn sub">⑮ 시트 · ⑯ 탭 바 · ⑰ 키패드 · ⑱ 차트(페이스 선·가로 막대·쌓은 막대)</div></div>`;
document.getElementById('r').innerHTML=[['라이트',''],['다크',' dark']].map(([n,c])=>`<div><p class="cap-h">${n}</p><div class="ph${c}">${C}</div></div>`).join('');
</script></body></html>
