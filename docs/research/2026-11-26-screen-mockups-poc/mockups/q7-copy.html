<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>/* 페이지 틀(시안 밖)은 Orca 테마 변수, 폰 안(.ph)은 DESIGN.md 토큰만 쓴다 */
body{margin:0;padding:16px;font-family:var(--font-sans,system-ui);background:var(--background,#fff);color:var(--foreground,#171717);font-size:14px;line-height:1.5}
.note{font-size:13px;color:var(--muted-foreground,#666);margin:4px 0 12px}
.cap-h{font-size:14px;font-weight:700;margin:0 0 6px}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-bottom:20px}
.ph{width:375px;flex:none;box-sizing:border-box;background:var(--o-background);color:var(--o-text);font-family:'Pretendard',system-ui,sans-serif;border-radius:28px;overflow:hidden;position:relative;border:1px solid var(--border,#ddd);font-size:17px;line-height:25.5px;letter-spacing:0}
.ph *{box-sizing:border-box}
.ph .sb{height:20px}
/* 타이포 토큰 */
.ph .hero{font-size:32px;line-height:42px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.ph .t1{font-size:26px;line-height:35px;font-weight:700}
.ph .t2{font-size:22px;line-height:31px;font-weight:700}
.ph .t3{font-size:20px;line-height:29px;font-weight:600}
.ph .bd{font-size:17px;line-height:25.5px;font-weight:400}
.ph .amt{font-size:17px;line-height:25.5px;font-weight:600;font-variant-numeric:tabular-nums}
.ph .bs{font-size:15px;line-height:22.5px;font-weight:400}
.ph .fn{font-size:13px;line-height:19.5px;font-weight:400}
.ph .amts{font-size:13px;line-height:19.5px;font-weight:600;font-variant-numeric:tabular-nums}
.ph .cp{font-size:11px;line-height:16.5px;font-weight:400}
.ph .sub{color:var(--o-text-sub)}
.ph .inc{color:var(--o-amount-income)}
.ph .up{color:var(--o-amount-up)}
.ph .dn{color:var(--o-amount-down)}
.ph .pine{color:var(--o-primary-text)}
.ph .sb6{font-weight:600}
.ph .fx{display:flex;justify-content:space-between;align-items:center;gap:8px}
 .ph{--o-primary:#14573f;--o-on-primary:#ffffff;--o-primary-pressed:#0e4431;--o-primary-text:#14573f;--o-primary-soft:#e6f0eb;--o-background:#f4f5f3;--o-surface:#ffffff;--o-surface-alt:#efecea;--o-text:#191f28;--o-text-sub:#5b6470;--o-text-disabled:#b0b8c1;--o-divider:#e5e8e6;--o-border-strong:#868e8a;--o-danger:#c81e2d;--o-warning:#a85400;--o-warning-soft:#fff3e0;--o-scrim:#00000033;--o-pressed:#191f280d;--o-amount-income:#1b64da;--o-amount-up:#c81e2d;--o-amount-up-display:#f04452;--o-amount-down:#1b64da;--o-amount-down-display:#3182f6;--o-ledger-private:#8e3b7e;--o-ledger-private-soft:#f7e8f3;--o-chart-group-cash:#edb345;--o-chart-group-saving:#7a59c3;--o-chart-group-invest:#008b96;--o-chart-group-point:#ecb7df;--o-chart-group-lent:#b66b31;--o-chart-group-debt:#8e9592;--o-chart-dim:#e5e8e6;--o-chart-neutral:#868e8a;--o-chart-line:#191f28;--o-chart-reference:#5b6470;--o-chart-axis:#868e8a} .ph.dark{--o-primary:#1f7a55;--o-on-primary:#ffffff;--o-primary-pressed:#186446;--o-primary-text:#5cc59a;--o-primary-soft:#1a2e25;--o-background:#121413;--o-surface:#1c1f1e;--o-surface-alt:#242826;--o-text:#e8eae9;--o-text-sub:#8e9592;--o-text-disabled:#565c59;--o-divider:#2c302e;--o-border-strong:#767d7a;--o-danger:#ff6b6b;--o-warning:#ffa861;--o-warning-soft:#3d2500;--o-scrim:#0000008f;--o-pressed:#e8eae90f;--o-amount-income:#4795ff;--o-amount-up:#ff6b6b;--o-amount-up-display:#ff6b6b;--o-amount-down:#4795ff;--o-amount-down-display:#4795ff;--o-ledger-private:#e7a3d8;--o-ledger-private-soft:#3a2335;--o-chart-group-cash:#f7c15f;--o-chart-group-saving:#886acf;--o-chart-group-invest:#3fbfcc;--o-chart-group-point:#f8d0ee;--o-chart-group-lent:#d78951;--o-chart-group-debt:#6e7572;--o-chart-dim:#2c302e;--o-chart-neutral:#767d7a;--o-chart-line:#e8eae9;--o-chart-reference:#8e9592;--o-chart-axis:#767d7a}
.ph{height:667px}
.ph .hd{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.ph .w{background:var(--o-surface)}
.ph .pad{padding:0 24px}
.ph .kv{display:flex;justify-content:space-between;padding:14px 0}
.ph .hl{height:1px;background:var(--o-divider);margin:0 24px}
.ph .note2{display:flex;gap:6px;padding:12px 24px;color:var(--o-text-sub)}
.ph .lk{color:var(--o-ledger-private);font-weight:600}
.ph .cta{position:absolute;left:16px;right:16px;bottom:34px;height:56px;border-radius:16px;background:var(--o-primary);color:var(--o-on-primary);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600}
.ph .cta2{position:absolute;left:16px;right:16px;bottom:98px;height:56px;border-radius:16px;background:var(--o-surface-alt);color:var(--o-text);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600}
.ph .sw{width:51px;height:31px;border-radius:16px;background:var(--o-surface-alt);position:relative;border:1px solid var(--o-divider)}
.ph .sw:after{content:'';position:absolute;left:2px;top:2px;width:25px;height:25px;border-radius:13px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.ph .scrim{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.ph .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--o-surface);border-radius:20px 20px 0 0;padding:24px 24px 0;height:470px}
.ph ul{margin:12px 0 0;padding-left:20px}.ph li{margin:6px 0}
</style></head><body>
<p class="note">나만 보기 문구 예시예요. 주인(민호) 화면이에요. 가구원은 지수 한 명이에요.</p>
<div class="row" id="r"></div>
<script>
const A=`<div class="sb"></div><div class="hd"><span class="bd">‹</span><span class="bd sb6">기록 확인</span><span style="width:12px"></span></div>
<div class="w"><div class="pad" style="padding:24px"><div class="fn sub">공용 장부 · 지출</div><div class="hero">−80,000원</div></div>
<div class="hl"></div><div class="pad">
<div class="kv"><span class="bs sub">가맹점</span><span class="bd">저녁 ›</span></div>
<div class="kv"><span class="bs sub">카테고리</span><span class="bd">외식 ›</span></div>
<div class="kv"><span class="bs sub">낸 곳</span><span class="bd"><span class="lk">🔒</span> 비상금 카드 ›</span></div></div>
<div class="note2 fn"><span>ⓘ</span><span>지수에게는 결제가 ‘민호’로만 보여요</span></div>
<div class="pad"><div class="kv"><span class="bs sub">날짜</span><span class="bd">오늘 19:20 ›</span></div></div></div>
<div class="cta2">저장하고 하나 더</div><div class="cta">저장</div>`;
const B=`<div class="sb"></div><div class="hd"><span class="bd">‹</span><span class="bd sb6">생활비 통장</span><span style="width:12px"></span></div>
<div class="w"><div class="pad"><div class="kv" style="align-items:center"><div><div class="bd">나만 보기</div><div class="fn sub">켜면 지수에게 이 지갑이 보이지 않아요</div></div><span class="sw"></span></div></div>
<div class="hl"></div>
<div class="pad" style="padding-top:14px;padding-bottom:16px"><div class="bs">기록이 있는 지갑은 나만 보게 할 수 없어요.</div><div class="bs sub" style="margin-top:6px">나만 볼 수 있는 지갑을 새로 만들고 옮겨 주세요.</div><div style="margin-top:12px"><span class="pine bs sb6">나만 볼 수 있는 지갑 만들기 ›</span></div></div></div>
<p style="padding:8px 24px;font-size:11px;color:#E5484D">↑ 스위치를 누르면 켜지지 않고 이유가 펼쳐져요(경고 아이콘·빨강 없음). 전환한 지갑도 같은 문구예요.</p>`;
const C=`<div class="sb"></div><div class="hd"><span class="bd">‹</span><span class="bd sb6">비상금 카드</span><span style="width:12px"></span></div><div class="scrim"></div>
<div class="sheet"><div class="t3">지수에게도 보이게 할까요?</div>
<div class="bs sub" style="margin-top:8px">보이게 하면 다시 나만 보게 할 수 없어요.</div>
<ul class="bs"><li>지갑 이름과 잔액, 지난 달 자산 추이</li><li>공용 기록의 결제가 ‘민호 · 비상금 카드’로</li><li><b>이 지갑에 적은 내 장부 기록의 달마다 합계</b></li></ul>
<div class="cta2" style="bottom:98px">취소</div><div class="cta">보이게 하기</div></div>`;
document.getElementById('r').innerHTML=[['확인 화면: 주인 쪽 한 줄',A,''],['지갑 설정: 막힘 문구',B,''],['보이게 바꾸기 확인',C,''],['보이게 바꾸기 확인 (다크)',C,' dark']].map(([n,h,c])=>`<div><p class="cap-h">${n}</p><div class="ph${c}">${h}</div></div>`).join('');
</script></body></html>
